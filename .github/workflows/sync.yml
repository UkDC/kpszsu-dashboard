name: sync
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: data
          path: state
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Собрать новые посты канала
        run: python -I collector/kpszsu_collect.py --out state
      - name: Собрать сайт
        run: python -I collector/build_site.py state _site
      - name: Сохранить состояние в ветку data (один коммит, без истории)
        working-directory: state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan snapshot
          git add -A
          git commit -qm "data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f origin snapshot:data
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
