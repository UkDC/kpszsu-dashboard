<style>

:root{

  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#6250d6; --s8:#e34948;
  --q0:#eef2f7; --q1:#cde2fb; --q2:#9ec5f4; --q3:#6da7ec; --q4:#3987e5; --q5:#256abf; --q6:#184f95; --q7:#0d366b;

}

  --bg:#0f1216; --panel:#171b21; --ink:#eef0f3; --ink-2:#b4bbc7; --ink-3:#7f8897; --line:#262c35; --grid:#20252d;
  --accent:#5b9bf0; --accent-ink:#0b1220; --chip:#202631;
  --crit:#ff6b6b; --crit-bg:#3a1a1c; --warn:#f0b54a; --warn-bg:#352a14; --good:#4cc47a; --good-bg:#15301f;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#0ca30c; --s7:#9085e9; --s8:#e66767;
  --q0:#1b2027; --q1:#163056; --q2:#1c4378; --q3:#235a9e; --q4:#2a72c6; --q5:#4b8fe0; --q6:#79acec; --q7:#b0cff5;
  --thr:rgba(255,107,107,.14); --qt-lo:#eef0f3; --qt-hi:#0b1220; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1216; --panel:#171b21; --ink:#eef0f3; --ink-2:#b4bbc7; --ink-3:#7f8897; --line:#262c35; --grid:#20252d;
  --accent:#5b9bf0; --accent-ink:#0b1220; --chip:#202631;
  --crit:#ff6b6b; --crit-bg:#3a1a1c; --warn:#f0b54a; --warn-bg:#352a14; --good:#4cc47a; --good-bg:#15301f;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#0ca30c; --s7:#9085e9; --s8:#e66767;
  --q0:#1b2027; --q1:#163056; --q2:#1c4378; --q3:#235a9e; --q4:#2a72c6; --q5:#4b8fe0; --q6:#79acec; --q7:#b0cff5;
  --thr:rgba(255,107,107,.14); --qt-lo:#eef0f3; --qt-hi:#0b1220; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--f-ui);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
.wrap{max-width:1280px;margin:0 auto;display:grid;gap:16px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
h1{font-size:20px;font-weight:700;margin:0;letter-spacing:-.01em}
h2{font-size:13px;font-weight:600;margin:0;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2)}
.sub{color:var(--ink-3);font-size:12px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
.brand{display:flex;flex-direction:column;gap:2px;min-width:0}
.periods{display:flex;background:var(--chip);border-radius:8px;padding:3px;gap:2px}
.periods button{font:600 13px var(--f-ui);border:0;background:transparent;color:var(--ink-2);padding:6px 12px;border-radius:6px;cursor:pointer}
.periods button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.periods button:focus-visible,.chipbtn:focus-visible,.tile:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.status{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:12px;padding:4px 10px;border-radius:999px;background:var(--chip);color:var(--ink-2)}
.pill.crit{background:var(--crit-bg);color:var(--crit)}
.pill.good{background:var(--good-bg);color:var(--good)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor}
.pill.crit .dot{animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.pill.crit .dot{animation:none}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;gap:12px;min-width:0;align-content:start}
.ph{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline;justify-content:space-between}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.c12{grid-column:span 12}.c8{grid-column:span 8}.c7{grid-column:span 7}.c5{grid-column:span 5}.c4{grid-column:span 4}.c6{grid-column:span 6}
@media (max-width:980px){.c8,.c7,.c5,.c4,.c6{grid-column:span 12}}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
@media (max-width:900px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:480px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi:last-child:nth-child(odd){grid-column:1/-1}.kpi .vs{display:none}}
.kpi{background:var(--panel);padding:12px 14px;display:grid;gap:2px;min-width:0}
.kpi .lbl{font-size:12px;color:var(--ink-3)}
.kpi .val{font:600 24px/1.15 var(--f-num);font-variant-numeric:tabular-nums}
.kpi .d{font:12px var(--f-num);color:var(--ink-3)}
.d.up{color:var(--crit)}.d.dn{color:var(--good)}
.d.upg{color:var(--good)}.d.dng{color:var(--crit)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chipbtn{display:inline-flex;align-items:center;gap:6px;font:500 12px var(--f-ui);border:1px solid var(--line);background:var(--panel);color:var(--ink-2);padding:4px 9px;border-radius:999px;cursor:pointer}
.chipbtn[aria-pressed="true"]{background:var(--chip);color:var(--ink);border-color:var(--ink-3)}
.sw{width:10px;height:10px;border-radius:3px;flex:none}
/* «сейчас» */
.now{display:grid;gap:8px;max-height:640px;overflow:auto;align-content:start}
.trk{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:start;padding:10px 12px;border:1px solid var(--line);border-radius:8px}
.trk .ty{font-weight:600}
.trk .route{color:var(--ink-2);font-size:13px;overflow-wrap:anywhere}
.trk .age{font:12px var(--f-num);color:var(--ink-3);white-space:nowrap}
.empty{color:var(--ink-3);font-size:13px;padding:8px 0}
.oblgrp{display:grid;gap:4px}
.oblgrp b{font-size:12px;color:var(--ink-2)}
.line{display:flex;gap:8px;font-size:13px;align-items:baseline}
.line .tm{font:12px var(--f-num);color:var(--ink-3);flex:none}
/* карта */
.legend{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ink-3)}
.legend .ramp{display:flex;gap:2px}.legend .ramp i{width:16px;height:8px;border-radius:2px;display:block}
.map{position:relative}
.map svg{max-height:78vh}
.map svg{display:block;width:100%;height:auto}
.map .ob{stroke:var(--panel);stroke-width:1.4;cursor:pointer;transition:opacity .15s}
.map .ob:hover{opacity:.82}
.map .ob:focus-visible{outline:none;stroke:var(--accent);stroke-width:3}
.map .ob.sel{stroke:var(--ink);stroke-width:3}
.map .ob.route{stroke:var(--crit);stroke-width:3}
.map text{pointer-events:none;text-anchor:middle}
.map .mn{font:600 17px var(--f-ui)}
.map .mv{font:700 25px var(--f-num)}
.map .ord circle{fill:var(--crit)}.map .ord text{fill:#fff;font:700 15px var(--f-num)}
.map .rline{fill:none;stroke:var(--crit);stroke-width:3;stroke-dasharray:6 5}
.balnote{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--chip);font-size:13px;color:var(--ink-2)}
.balnote b{color:var(--ink)}
.balrow{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:6px;font:12px var(--f-num)}
.map .src{font:11px var(--f-ui);fill:var(--ink-3);text-anchor:end}
/* таблицы */
.tbl{overflow:auto;max-height:560px}
#reports{max-height:640px;overflow:auto;display:grid;gap:8px;align-content:start}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-weight:600;color:var(--ink-3);font-size:11px;text-transform:uppercase;letter-spacing:.05em;text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid var(--grid);vertical-align:top}
td.r,th.r{text-align:right}
tr.click{cursor:pointer}
/* Сейчас в небе */
.nowsum{display:flex;flex-wrap:wrap;gap:8px 28px;padding:2px 2px 12px;border-bottom:1px solid var(--line)}
.nst{display:flex;align-items:baseline;gap:6px}.nst b{font-size:22px;font-weight:600;color:var(--ink)}.nst span{font-size:12px;color:var(--ink-3)}
.nowlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(400px,1fr));column-gap:28px}
.nrow{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;padding:10px 4px;border-bottom:1px solid var(--grid);cursor:pointer;border-radius:6px}
.nrow:hover,.nrow:focus-visible{background:var(--chip);outline:none}
.nrow .tm{font:12px/20px var(--f-num);color:var(--ink-3)}
.nt{display:flex;align-items:center;flex-wrap:wrap;gap:4px 8px;line-height:20px}.nt b{font-weight:600}
.nreg{font-size:12px;color:var(--ink-2)}.nty{font-size:11px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.04em}
.nroute{font-size:12px;color:var(--ink-2);margin-top:2px}
.nx{font-size:12px;color:var(--ink-3);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ntag{font:11px/1.35 var(--f-num);color:var(--ink-2);text-align:right;background:var(--chip);border-radius:6px;padding:3px 7px;align-self:start}
.now.wide{display:block;max-height:none;overflow:visible}
@media (max-width:640px){.nowlist{grid-template-columns:1fr}.nst b{font-size:18px}}
/* Официальные итоги */
.rlg{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--ink-2);margin:14px 0 4px}
.rlg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.rrows{display:grid}
.rrow{display:grid;grid-template-columns:150px minmax(120px,1fr) 150px;grid-template-areas:"l b v" "l t t";gap:4px 16px;align-items:center;padding:10px 6px;border-bottom:1px solid var(--grid);cursor:pointer;border-radius:6px}
.rrow:hover,.rrow:focus-visible,.rrow.on{background:var(--chip);outline:none}
.rl{grid-area:l;display:grid;align-self:start}.rl b{font-weight:600;font-size:14px}
.rbar{grid-area:b;height:12px}.rtrack{display:flex;gap:2px;height:100%}
.rtrack i{display:block;height:100%;min-width:2px}.rtrack .rd{background:var(--s1);border-radius:4px 0 0 4px}.rtrack .ru{background:var(--s2);border-radius:0 4px 4px 0}
.rtrack .rd:last-child{border-radius:4px}
.rv{grid-area:v;display:flex;align-items:baseline;gap:6px;justify-content:flex-end}.rv b{font-size:16px}.rv span{color:var(--ink-3);font-size:12px}.rv em{font-style:normal;font-weight:600;min-width:38px;text-align:right}
.rtags{grid-area:t;display:flex;flex-wrap:wrap;gap:4px 6px}
.bdg{font-size:11px;line-height:18px;padding:0 8px;border-radius:999px;background:var(--chip);color:var(--ink-2);white-space:nowrap}
.rrow.on .bdg,.rrow:hover .bdg{background:var(--panel)}
.bdg.lnk{color:var(--accent);text-decoration:none}
.rdet{grid-column:1/-1;padding-top:6px}.rdet p{white-space:pre-wrap;font-size:12px;margin:6px 0 0;color:var(--ink-2)}
@media (max-width:640px){.rrow{grid-template-columns:1fr auto;grid-template-areas:"l v" "b b" "t t"}}
tr.click:hover td{background:var(--chip)}
tr.on td{background:var(--chip)}
/* графики */
svg text{fill:var(--ink-3);font:11px var(--f-num)}
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;height:auto}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:6px 8px;border-radius:6px;white-space:nowrap;transform:translate(-50%,-100%);margin-top:-8px;z-index:3}
.tip b{font-weight:600}
.lg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--ink-2)}
.lg span{display:inline-flex;align-items:center;gap:5px}
details summary{cursor:pointer;color:var(--ink-2);font-weight:600}
.posts{max-height:420px;overflow:auto;display:grid;gap:6px;margin-top:10px}
.posts .line{border-bottom:1px solid var(--grid);padding-bottom:4px}
.note{font-size:12px;color:var(--ink-3)}
.loading{padding:40px 0;text-align:center;color:var(--ink-3)}
.unp{color:var(--warn)}
a{color:var(--accent)}
.linkbtn{font:inherit;color:var(--accent);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline}.linkbtn:disabled{color:var(--ink-3);cursor:default}
</style>
</head>

function allEvents(){const out=[];for(const d of Object.values(S.days))for(const e of d.events||[])if(!HIDE.has(e.k))out.push(nk(e));return out}
function allTracks(){const out=[];for(const d of Object.values(S.days))for(const t of d.tracks||[])if(!HIDE.has(t.k))out.push(nk(t));return out}
const tid=e=>e.tr||("s"+e.id); // цель = цепочка оповещений (оповещение + ответы о смене курса)
const nTargets=es=>new Set(es.map(tid)).size;
const plT=n=>{const a=Math.abs(n)%100,b=a%10;return a>10&&a<20?"целей":b===1?"цель":b>=2&&b<=4?"цели":"целей"};
function balIn(win){return S.ballistic.filter(b=>inWin(b.start,win))}
function nowRef(){ // «зараз» = пізніше з реального часу та останнього поста
  return Date.now();
}
function windowOf(h,shift=0){const end=nowRef()-shift*h*3600e3;return [end-h*3600e3,end]}
function inWin(iso,[a,b]){const t=Date.parse(iso);return t>a&&t<=b}

// Зведення: кожне покриває свій інтервал; беремо ті, що опубліковані у вікні
function reportsIn(win){return Object.values(S.reports).filter(r=>inWin(r.t,win)).sort((a,b)=>a.t<b.t?-1:1)}
function sumReports(rs){
  const s={att:0,down:0,uav:0,jet:0,hits:0,debris:0,n:rs.length,hitsN:0,debrisN:0};
  for(const r of rs){s.att+=r.attackedTotal||0;s.down+=r.downedTotal||0;s.uav+=r.uav||0;s.jet+=r.uavJet||0;
    if(r.hits!=null){s.hits+=r.hits;s.hitsN++} if(r.debris!=null){s.debris+=r.debris;s.debrisN++}}
  return s}

  const evF=ev.filter(e=>!S.type||e.k===S.type);
  const tracks=allTracks().filter(t=>inWin(t.t1,win)||inWin(t.t0,win));
  const app=$("#app");

  app.innerHTML=`
  <div class="grid">
    <section class="panel c12"><div class="ph"><h2>Области</h2><span class="sub" id="mapsub"></span></div>
      <div class="chips" id="tchips"></div><div class="map" id="map"></div>
      <div class="legend"><span>меньше</span><span class="ramp">${[1,2,3,4,5,6,7].map(i=>`<i style="background:var(--q${i})"></i>`).join("")}</span><span>больше целей</span></div>
      <p class="note" style="margin:0">Цель — оповещение канала вместе с ответами-уточнениями о смене курса; цель, прошедшая через несколько областей, учтена в каждой. Оценка приблизительная: уточнение без ответа считается новой целью, группа БпЛА — одной.</p>
      <div id="oblfeed"></div></section>
    <section class="panel c12"><div class="ph"><h2>Сейчас в небе</h2><span class="sub">цели за последние 60 мин · нажмите строку, чтобы найти область на карте</span></div><div id="now" class="now wide"></div></section>
    ${long?`<section class="panel c12"><div class="ph"><h2>События по дням</h2><span class="sub">целей по типу (цель учтена в день, когда о ней были оповещения)</span></div><div id="timeline" class="chart"></div><div class="lg" id="tlleg"></div></section>`:""}
    ${S.h===1?"":`<section class="panel c12"><div class="ph"><h2>Официальные итоги</h2><span class="sub">сводки Воздушных сил, предварительные данные · выходят утром (за ночь) и вечером (за день)</span></div>${kpiHTML(win,prev)}<div id="reports"></div></section>`}
    ${long?`<section class="panel c7"><div class="ph"><h2>Когда атакуют</h2><span class="sub">целей: час суток × день (киевское время)</span></div><div id="heat" class="chart"></div></section>
    <section class="panel c5"><div class="ph"><h2>Районы пусков</h2><span class="sub">сколько сводок упоминают район</span></div><div id="launch"></div></section>`:""}
    <section class="panel c12"><details><summary>Все оповещения за период (${nf(ev.length)})<span class="sub" id="unpc"></span></summary><div class="posts" id="posts"></div></details></section>
  </div>`;
  renderStatus(evAll);
  renderNow(evAll);
  renderMap(ev,tracks,win);
  if(long)renderTimeline(ev,win,long);
  if(S.h!==1)renderReports(win,long);

}

function kpiHTML(win,prev){
  const a=sumReports(reportsIn(win)), b=sumReports(reportsIn(prev));
  const items=[
    ["Атаковано",a.att,b.att,"bad"],
    ["Сбито / подавлено",a.down,b.down,"good"],
    ["Перехват",pct(a.down,a.att),pct(b.down,b.att),"good","%"],
    ["Доля реактивных БпЛА",pct(a.jet,a.uav),pct(b.jet,b.uav),"bad","%"],
    ["Попадания, локаций",a.hitsN?a.hits:null,b.hitsN?b.hits:null,"bad"]];
  const lbl={1:"пред. час",12:"пред. 12 ч",24:"пред. сутки",168:"пред. 7 дней",720:"пред. 30 дней"}[S.h];
  return `<div class="kpis">${items.map(([l,v,p,pol,u])=>{
    let d="";
    if(v!=null&&p!=null&&p!==0){const df=v-p;const cls=df===0?"":pol==="neutral"?"":pol==="bad"?(df>0?"up":"dn"):(df>0?"upg":"dng");
      d=`<span class="d ${cls}">${df>0?"▲":df<0?"▼":"="} ${Math.abs(df)}${u||""}<span class="vs"> vs ${lbl}</span></span>`}
    else d=`<span class="d">${a.n?"":"сводок в периоде пока нет"}</span>`;
    return `<div class="kpi"><span class="lbl">${l}</span><span class="val">${v==null?"—":nf(v)+(u||"")}</span>${d}</div>`}).join("")}</div>
    <p class="note" style="margin:6px 2px 0">Сумма сводок, опубликованных в выбранном периоде; ▲▼ — изменение к предыдущему такому же периоду. Ракеты, число которых в сводке не указано, не учтены.</p>`;
}

function renderStatus(evAll){
  const st=$("#status");const now=nowRef();
  const last=S.ballistic[S.ballistic.length-1];
  const active=last&&!last.cleared&&!last.end&&(now-Date.parse(last.start))<3*3600e3;
  const hour=nTargets(evAll.filter(e=>now-Date.parse(e.t)<3600e3));
  const lastPost=S.meta?.lastPostAt?new Date(S.meta.lastPostAt):null;
  const lag=lastPost?Math.round((now-lastPost)/60000):null;
  st.innerHTML=(active?`<span class="pill crit"><span class="dot"></span>Угроза баллистики${last.from?" "+esc(last.from.startsWith("з")?last.from:"з "+last.from):""} з ${fmtT(new Date(last.start))}</span>`:`<span class="pill good"><span class="dot"></span>Угрозы баллистики нет</span>`)+
    `<span class="pill ${hour>15?"warn":""}">${hour} ${plT(hour)} за час</span>`+
    (lag!=null&&lag>90?`<span class="pill warn">данные отстают на ${lag} мин</span>`:"");
  $("#upd").textContent=S.meta?`обновлено ${fmtDT(new Date(S.meta.updatedAt))} · последний пост ${lastPost?fmtT(lastPost):"—"}`:"";
}

const FULLN={...ONAME,khm:"Хмельницкий",kir:"Кропивницкий",ter:"Тернополь",if:"Ивано-Франковск"};
function routeStr(codes){return codes.map(c=>FULLN[c]||c).join(" → ")}

function renderNow(evAll){
  const now=nowRef();const el=$("#now");
  const recent=evAll.filter(e=>now-Date.parse(e.t)<3600e3).sort((a,b)=>a.t<b.t?1:-1);
  if(!recent.length){el.innerHTML=`<div class="empty nowempty">За последний час оповещений о целях не было${S.meta?.lastPostAt&&now-Date.parse(S.meta.lastPostAt)>3600e3?" (или данные ещё не обновились)":""}.</div>`;return}
  const byTr={};for(const e of evAll){if(!e.tr)continue;(byTr[e.tr]=byTr[e.tr]||[]).push(e)}
  const items=[];const seen=new Set();
  for(const e of recent){const k=e.tr||("s"+e.id);if(seen.has(k))continue;seen.add(k);
    const grp=(e.tr&&byTr[e.tr]?byTr[e.tr]:[e]).slice().sort((a,b)=>a.t<b.t?-1:1);
    const route=[];for(const g of grp)for(const o of g.o||[])if(o!=="ru"&&route[route.length-1]!==o)route.push(o);
    const last=grp[grp.length-1];items.push({last,grp,route,mins:Math.round((Date.parse(last.t)-Date.parse(grp[0].t))/60000)})}
  const obl=new Set(recent.flatMap(e=>(e.o||[]).filter(o=>o!=="ru")));
  const lastAgo=Math.max(0,Math.round((now-Date.parse(recent[0].t))/60000));
  const clean=t=>t.replace(/^[^\wА-Яа-яІіЇїЄєҐґ«"]+/u,"");
  const stat=(v,l)=>`<div class="nst"><b class="num">${v}</b><span>${l}</span></div>`;
  el.innerHTML=`<div class="nowsum">${stat(items.length,plT(items.length))}${stat(obl.size,(n=>{const a=n%100,b=n%10;return a>10&&a<20?"областей":b===1?"область":b>=2&&b<=4?"области":"областей"})(obl.size))}${stat(lastAgo<1?"сейчас":lastAgo+" мин","с последнего")}</div>
  <div class="nowlist">${items.map(({last,grp,route,mins})=>{const o=(last.o||[]).filter(x=>x!=="ru").slice(-1)[0];
    const place=last.p||ONAME[o]||"—";const reg=last.p&&o?ONAME[o]:"";
    return `<div class="nrow" data-o="${o||""}" tabindex="0">
      <span class="tm">${fmtT(new Date(last.t))}</span>
      <div class="nmain"><div class="nt"><span class="sw" style="background:${TCOL[last.k]}"></span><b>${esc(place)}</b>${reg?`<span class="nreg">${esc(reg)}</span>`:""}<span class="nty">${esc(TNAME[last.k])}${last.pl?" · группа":""}</span></div>
        ${route.length>1?`<div class="nroute">${esc(routeStr(route))}</div>`:""}
        <div class="nx">${esc(clean(last.x))}</div></div>
      ${grp.length>1?`<span class="ntag">курс менялся<br>${mins} мин в пути</span>`:"<span></span>"}</div>`}).join("")}</div>`;
  el.querySelectorAll(".nrow[data-o]").forEach(r=>{if(!r.dataset.o)return;const go=()=>{S.obl=r.dataset.o;render();$("#map")?.scrollIntoView({behavior:"smooth",block:"center"})};
    r.onclick=go;r.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();go()}}});
}

// Расстановка подписей. Размер шрифта одинаковый для всех областей.
// Подпись ставится внутри своей области (полное или краткое название); если не помещается —
// выносится на свободное поле рядом с линией-выноской, как плашка «Киев».
// На узком экране (телефон) названия не пишутся, только числа крупнее.
let LBL=null,LMOB=null;
const LF={d:{nf:15,vf:21},m:{nf:0,vf:36,bnf:24}};
const SHORT={chv:"Черн.",zak:"Закарп.",if:"Ив.-Фр.",ter:"Терн.",kyivobl:"Киевщ.",khm:"Хмельн.",kir:"Кир.",lug:"Луг.",don:"Дон."};
try{document.fonts?.ready?.then(()=>{if(S.ready)render()})}catch(e){}
let rzT;addEventListener("resize",()=>{clearTimeout(rzT);rzT=setTimeout(()=>{const m=$("#map");if(S.ready&&m&&(m.clientWidth<640)!==LMOB)render()},200)});
function layoutLabels(oc,mob){
  const [W,H]=GEO_VB;const F=mob?LF.m:LF.d;
  const cv=document.createElement("canvas");cv.width=W;cv.height=H;
  const ctx=cv.getContext("2d",{willReadFrequently:true});
  const codes=Object.keys(GEO).filter(c=>c!=="kyiv").concat(["kyiv"]);
  const key={};codes.forEach((c,i)=>{const r=(i*37+20)%256,g=(i*91+40)%256,b=(i*53+60)%256;key[(r<<16)|(g<<8)|b]=i;ctx.fillStyle=`rgb(${r},${g},${b})`;ctx.fill(new Path2D(GEO[c].d))});
  const px=ctx.getImageData(0,0,W,H).data;
  // -2 = пустое поле, -1 = граница/вне карты, иначе индекс области
  const own=(x,y)=>{x|=0;y|=0;if(x<2||y<2||x>=W-2||y>=H-24)return -1;const k=(y*W+x)*4;if(px[k+3]===0)return -2;if(px[k+3]<255)return -1;const id=key[(px[k]<<16)|(px[k+1]<<8)|px[k+2]];return id==null?-1:id};
  const placed=[];
  const ovl=r=>placed.some(p=>r[0]<p[2]+4&&p[0]<r[2]+4&&r[1]<p[3]+4&&p[1]<r[3]+4);
  const allIs=(r,id,st)=>{for(let y=r[1];y<=r[3]+.01;y+=st)for(let x=r[0];x<=r[2]+.01;x+=st)if(own(x,y)!==id)return false;return true};
  const fN=n=>`600 ${n}px ${getComputedStyle(document.body).getPropertyValue("--f-ui")||"sans-serif"}`;
  const fV=n=>`700 ${n}px ${getComputedStyle(document.body).getPropertyValue("--f-num")||"monospace"}`;
  const mw=(f,t)=>{ctx.font=f;return ctx.measureText(t).width};
  const out={};
  // Киев — всегда плашка справа снизу от точки
  {const g=GEO.kyiv,v=oc.kyiv||0,bnf=mob?F.bnf:F.nf;const nw=mw(fN(bnf),"Киев"),vw=mw(fV(F.vf),String(v));
   const bw=10+nw+10+vw+10,bh=F.vf+12,bx=g.x+16,by=g.y+14;
   out.kyiv={out:true,ax:g.x,ay:g.y,bx,by,bw,bh,nm:"Киев",nf:bnf};placed.push([bx,by,bx+bw,by+bh],[g.x-5,g.y-5,g.x+5,g.y+5])}
  const area=new Array(codes.length).fill(0);for(let i=0;i<px.length;i+=4){const id=key[(px[i]<<16)|(px[i+1]<<8)|px[i+2]];if(px[i+3]===255&&id!=null)area[id]++}
  const order=codes.filter(c=>c!=="kyiv").sort((a,b)=>area[codes.indexOf(a)]-area[codes.indexOf(b)]);
  const fails=[];
  for(const c of order){const id=codes.indexOf(c),g=GEO[c],v=oc[c]||0;let best=null;
    const vw=v?mw(fV(F.vf),String(v)):0;
    const names=mob?[null]:[ONAME[c],SHORT[c]].filter(Boolean);
    for(const nm of names){if(best)break;
      const w=(Math.max(nm?mw(fN(F.nf),nm):0,vw)+6)/2;
      const top=mob?-F.vf*.42:-3-F.nf*.8, bot=mob?F.vf*.42:(v?F.vf*.8+1:-3+F.nf*.28);
      for(let r=0;r<180&&!best;r+=2){const n=r?Math.max(8,Math.round(2*Math.PI*r/3)):1;
        for(let a=0;a<n;a++){const an=a/n*2*Math.PI,x=g.x+r*Math.cos(an),y=g.y+r*Math.sin(an);
          const rc=[x-w,y+top,x+w,y+bot];if(!ovl(rc)&&allIs(rc,id,2.5)){best={x,y,nm,rc};break}}}}
    if(best){placed.push(best.rc);out[c]=best}else fails.push(c)}
  // выноски: точка внутри области + плашка на свободном поле
  for(const c of fails){const id=codes.indexOf(c),g=GEO[c],v=oc[c]||0;
    let ax=g.x,ay=g.y;
    if(own(ax,ay)!==id){let bd=1e9;for(let y=0;y<H;y+=3)for(let x=0;x<W;x+=3)if(own(x,y)===id){const d=(x-g.x)**2+(y-g.y)**2;if(d<bd){bd=d;ax=x;ay=y}}}
    const nm=mob?null:(SHORT[c]||ONAME[c]);
    const nw=nm?mw(fN(F.nf),nm):0,vw=v?mw(fV(F.vf),String(v)):0;
    const bw=10+nw+(nm&&v?10:0)+vw+10,bh=F.vf+12;let best=null;
    for(let r=24;r<320&&!best;r+=4){const n=Math.max(12,Math.round(2*Math.PI*r/6));
      for(let a=0;a<n;a++){const an=a/n*2*Math.PI,cx=ax+r*Math.cos(an),cy=ay+r*Math.sin(an);
        const rc=[cx-bw/2,cy-bh/2,cx+bw/2,cy+bh/2];if(!ovl(rc)&&allIs([rc[0]-3,rc[1]-3,rc[2]+3,rc[3]+3],-2,3)){best=rc;break}}}
    if(!best){out[c]={x:g.x,y:g.y,nm:null};continue}
    placed.push(best);out[c]={out:true,ax,ay,bx:best[0],by:best[1],bw,bh,nm,nf:F.nf}}
  return out}

function renderMap(ev,tracks,win){
  const chips=$("#tchips");
  const counts={};{const sk={};for(const e of ev)(sk[e.k]=sk[e.k]||new Set).add(tid(e));for(const k in sk)counts[k]=sk[k].size}
  const thr=balIn(win);
  chips.innerHTML=`<button class="chipbtn" id="t-all" aria-pressed="${!S.type}">Все типы · ${nf(nTargets(ev))}</button>`+
    TYPES.filter(t=>counts[t[0]]||t[0]==="ballistic").map(([k,n,c])=>`<button class="chipbtn" id="t-${k}" data-k="${k}" aria-pressed="${S.type===k}"><span class="sw" style="background:var(${c})"></span>${n} · ${nf(counts[k]||0)}${k==="ballistic"&&thr.length?` · угроз ${thr.length}`:""}</button>`).join("");
  chips.querySelectorAll("button").forEach(b=>b.onclick=()=>{S.type=b.dataset.k||null;render()});
  const evF=ev.filter(e=>!S.type||e.k===S.type);
  const oc={},ok={};{const so={},sok={};for(const e of evF)for(const o of new Set(e.o||[])){(so[o]=so[o]||new Set).add(tid(e));((sok[o]=sok[o]||{})[e.k]=sok[o][e.k]||new Set).add(tid(e))}
    for(const o in so){oc[o]=so[o].size;ok[o]={};for(const k in sok[o])ok[o][k]=sok[o][k].size}}
  const brk=o=>TYPES.filter(t=>ok[o]?.[t[0]]).map(t=>`${t[1]}: ${ok[o][t[0]]}`);
  const max=Math.max(1,...Object.entries(oc).filter(([k])=>k!=="ru").map(([,v])=>v));
  const tr=S.track?tracks.find(t=>t.id===S.track):null;
  const routeIdx={};if(tr)tr.route.forEach((c,i)=>{if(!(c in routeIdx))routeIdx[c]=i+1});
  const m=$("#map");
  const [W,H]=GEO_VB;
  LMOB=m.clientWidth<640;LBL=layoutLabels(oc,LMOB);const F=LMOB?LF.m:LF.d;
  const codes=Object.keys(GEO).filter(c=>c!=="kyiv").concat(["kyiv"]); // Киев поверх области
  let svg=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Карта областей Украины: число целей">`;
  for(const c of codes){const v=oc[c]||0;const q=v?Math.min(7,1+Math.floor(v/max*6.999)):0;
    svg+=`<path class="ob ${S.obl===c?"sel":""} ${routeIdx[c]?"route":""}" data-o="${c}" data-i="${codes.indexOf(c)}" tabindex="0" d="${GEO[c].d}" fill="var(--q${q})"><title>${esc(FULLN[c]||c)}: ${v}${!S.type&&v?"\n"+esc(brk(c).join("\n")):""}</title></path>`}
  if(tr){const pts=tr.route.filter(c=>GEO[c]).map(c=>[GEO[c].x,GEO[c].y]);
    if(pts.length>1)svg+=`<polyline class="rline" points="${pts.map(p=>p.join(",")).join(" ")}"/>`}
  for(const c of codes){const v=oc[c]||0;const q=v?Math.min(7,1+Math.floor(v/max*6.999)):0;const g=GEO[c];
    const col=q>=5?"var(--qt-hi)":"var(--qt-lo)";const L=LBL[c];if(!L)continue;
    if(L.out){const nx=Math.max(L.bx,Math.min(L.ax,L.bx+L.bw)),ny=Math.max(L.by,Math.min(L.ay,L.by+L.bh));
      svg+=`<line x1="${L.ax.toFixed(1)}" y1="${L.ay.toFixed(1)}" x2="${nx.toFixed(1)}" y2="${ny.toFixed(1)}" stroke="var(--ink)" stroke-width="1.5"/><circle cx="${L.ax.toFixed(1)}" cy="${L.ay.toFixed(1)}" r="4" fill="var(--ink)"/>
      <rect x="${L.bx.toFixed(1)}" y="${L.by.toFixed(1)}" width="${L.bw.toFixed(1)}" height="${L.bh.toFixed(1)}" rx="7" fill="var(--panel)" stroke="var(--ink-3)"/>`;
      const by=L.by+L.bh/2+F.vf*.36;
      if(L.nm)svg+=`<text class="mn" x="${(L.bx+10).toFixed(1)}" y="${by.toFixed(1)}" style="fill:var(--ink-2);font-size:${L.nf}px;text-anchor:start">${esc(L.nm)}</text>`;
      if(v||c==="kyiv")svg+=`<text class="mv" x="${(L.bx+L.bw-10).toFixed(1)}" y="${by.toFixed(1)}" style="fill:var(--ink);font-size:${F.vf}px;text-anchor:end">${v}</text>`;
      continue}
    if(LMOB){if(v)svg+=`<text class="mv" x="${L.x.toFixed(1)}" y="${(L.y+F.vf*.36).toFixed(1)}" style="fill:${col};font-size:${F.vf}px">${v}</text>`;continue}
    if(L.nm)svg+=`<text class="mn" x="${L.x.toFixed(1)}" y="${(L.y-3).toFixed(1)}" style="fill:${col};font-size:${F.nf}px">${esc(L.nm)}</text>`;
    if(v)svg+=`<text class="mv" x="${L.x.toFixed(1)}" y="${(L.y+F.vf*.8).toFixed(1)}" style="fill:${col};font-size:${F.vf}px">${v}</text>`}
  if(tr){const seen=new Set();tr.route.forEach((c,i)=>{if(!GEO[c]||seen.has(c))return;seen.add(c);const L=LBL[c]||{};const g=L.out?{x:L.ax,y:L.ay}:L.x!=null?L:GEO[c];
    svg+=`<g class="ord"><circle cx="${g.x+28}" cy="${g.y-30}" r="13"/><text x="${g.x+28}" y="${g.y-25}">${i+1}</text></g>`})}
  svg+=`<text class="src" x="${W-8}" y="${H-6}">границы: geoBoundaries (CC BY 4.0)</text></svg>`;
  m.innerHTML=svg;
  m.querySelectorAll("[data-o].ob").forEach(b=>{const go=()=>{S.obl=S.obl===b.dataset.o?null:b.dataset.o;render()};
    b.addEventListener("click",go);b.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();go()}})});
  const top=Object.entries(oc).filter(([k])=>k!=="ru").sort((a,b)=>b[1]-a[1])[0];
  const nReg=Object.keys(oc).filter(k=>k!=="ru").length;
  $("#mapsub").textContent=tr?`маршрут: ${routeStr(tr.route)}`:`${nReg} из ${Object.keys(GEO).length} регионов${top?` · больше всего — ${FULLN[top[0]]||top[0]} (${nf(top[1])})`:""} · цифра — целей через область`;
  const f=$("#oblfeed");let fh="";
  if(S.type==="ballistic"){
    const fromS=b=>b.from?" "+(b.from.startsWith("з")?b.from:"з "+b.from):"";
    fh+=`<div class="balnote"><b>Угрозы баллистики за период: ${thr.length}</b>${counts.ballistic?"":` · целей с указанием области не было`}
      ${thr.length?`<div class="balrow">${thr.slice().reverse().slice(0,30).map(b=>`<span>${fmtD(new Date(b.start))} ${fmtT(new Date(b.start))}${b.end?"–"+fmtT(new Date(b.end)):""}${esc(fromS(b))}</span>`).join("")}</div>`:""}</div>`}
  if(S.obl){const es=evF.filter(e=>(e.o||[]).includes(S.obl)).sort((a,b)=>a.t<b.t?1:-1);
    fh+=`<div class="ph"><h2>${esc(ONAME[S.obl])}: ${nTargets(es)} ${plT(nTargets(es))}</h2><button class="chipbtn" id="oclose">Закрыть</button></div>${!S.type&&es.length?`<div class="note">${esc(brk(S.obl).join(" · "))}</div>`:""}<div class="posts">${es.slice(0,200).map(lineHTML).join("")}</div>`}
  f.innerHTML=fh;
  if(S.obl)$("#oclose").onclick=()=>{S.obl=null;render()}
}
function lineHTML(e){return `<div class="line"><span class="sw" style="background:${TCOL[e.k]}"></span><span class="tm">${fmtD(new Date(e.t))} ${fmtT(new Date(e.t))}</span><span>${esc(e.x)}</span></div>`}

// --- графік-стовпчики зі стеком
function renderTimeline(ev,win,long){
  const el=$("#timeline");
  const buckets=[];const step=long?24*3600e3:3600e3;
  let keys=[];
  if(long){const n=Math.round(S.h/24);for(let i=n-1;i>=0;i--){const d=new Date(win[1]-i*24*3600e3);keys.push(kyivDay(d))}}
  else{const start=Math.floor(win[0]/3600e3)*3600e3;for(let t=start+3600e3;t<=win[1]+3600e3-1;t+=3600e3)keys.push(t)}
  keys=keys.slice(-(long?Math.round(S.h/24):S.h));
  const idx=new Map(keys.map((k,i)=>[k,i]));
  const data=keys.map(()=>({}));
  {const seen=new Set();for(const e of ev){const t=Date.parse(e.t);const k=long?kyivDay(new Date(t)):Math.floor(t/3600e3)*3600e3;const i=idx.get(k);if(i==null)continue;const sk=i+"|"+tid(e)+"|"+e.k;if(seen.has(sk))continue;seen.add(sk);data[i][e.k]=(data[i][e.k]||0)+1}}
  const present=TYPES.filter(t=>data.some(d=>d[t[0]]));
  const tot=data.map(d=>Object.values(d).reduce((a,b)=>a+b,0));
  const max=Math.max(4,...tot);const nice=niceMax(max);
  const W=960,H=240,L=36,R=8,T=10,B=26,pw=W-L-R,ph=H-T-B;const bw=pw/keys.length;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Цели по ${long?"дням":"часам"}">`;
  for(let g=0;g<=4;g++){const y=T+ph-ph*g/4;s+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="var(--grid)"/><text x="${L-6}" y="${y+4}" text-anchor="end">${Math.round(nice*g/4)}</text>`}
  if(!long){ // інтервали балістики
    for(const b of S.ballistic){const a=Date.parse(b.start),z=b.end?Date.parse(b.end):Date.now();
      const x0=L+(a-(keys[0]-3600e3))/3600e3*bw, x1=L+(z-(keys[0]-3600e3))/3600e3*bw;
      if(x1<L||x0>W-R)continue;s+=`<rect x="${Math.max(L,x0)}" y="${T}" width="${Math.max(2,Math.min(W-R,x1)-Math.max(L,x0))}" height="${ph}" fill="var(--thr)"/>`}}
  keys.forEach((k,i)=>{
    let y=T+ph;const x=L+i*bw+Math.max(1,bw*.12),w=Math.max(2,bw*.76);
    present.forEach(([tk],j)=>{const v=data[i][tk]||0;if(!v)return;const h=ph*v/nice;y-=h;
      s+=`<rect x="${x}" y="${y}" width="${w}" height="${Math.max(0,h-(j?0:0))}" fill="${TCOL[tk]}" stroke="var(--panel)" stroke-width="1"/>`});
    s+=`<rect class="hit" data-i="${i}" x="${L+i*bw}" y="${T}" width="${bw}" height="${ph}" fill="transparent"/>`;
    const every=long?(keys.length>10?3:1):(keys.length>12?3:1);
    if(i%every===0){const lab=long?fmtD(new Date(k+"T12:00:00Z")):fmtT(new Date(k-3600e3));s+=`<text x="${L+i*bw+bw/2}" y="${H-8}" text-anchor="middle">${lab}</text>`}
  });
  s+=`</svg>`;el.innerHTML=s+`<div class="tip" hidden></div>`;
  $("#tlleg").innerHTML=present.map(([k,n,c])=>`<span><i class="sw" style="background:var(${c})"></i>${n}</span>`).join("");
  hover(el,".hit",i=>{const d=data[i];const k=keys[i];
    const head=long?fmtD(new Date(k+"T12:00:00Z")):`${fmtT(new Date(k-3600e3))}–${fmtT(new Date(k))}`;
    return `<b>${head}</b> · ${tot[i]}<br>`+present.filter(t=>d[t[0]]).map(t=>`${t[1]}: ${d[t[0]]}`).join("<br>")});
}
function niceMax(v){const p=Math.pow(10,Math.floor(Math.log10(v)));for(const m of [1,2,2.5,5,10])if(m*p>=v)return m*p;return v}
function hover(el,sel,fn){const tip=el.querySelector(".tip");
  el.querySelectorAll(sel).forEach(r=>{r.addEventListener("mouseenter",()=>{tip.innerHTML=fn(+r.dataset.i);tip.hidden=false});
    r.addEventListener("mousemove",ev=>{const b=el.getBoundingClientRect();let x=ev.clientX-b.left;x=Math.max(80,Math.min(b.width-80,x));tip.style.left=x+"px";tip.style.top=(ev.clientY-b.top)+"px"});
    r.addEventListener("mouseleave",()=>tip.hidden=true)})}

function renderTracks(tracks){
  const el=$("#tracks");
  const list=tracks.filter(t=>!S.type||t.k===S.type).sort((a,b)=>a.t1<b.t1?1:-1);
  if(!list.length){el.innerHTML=`<div class="empty">В этом периоде нет цепочек сообщений (целей со сменой курса).</div>`;return}
  el.innerHTML=`<table><thead><tr><th>Время</th><th>Цель</th><th>Маршрут</th><th class="r">Сообщ.</th><th class="r">Мин</th></tr></thead><tbody>${
    list.slice(0,150).map(t=>`<tr class="click ${S.track===t.id?"on":""}" data-id="${t.id}"><td class="num">${fmtD(new Date(t.t0))} ${fmtT(new Date(t.t0))}</td>
    <td><span class="line"><span class="sw" style="background:${TCOL[t.k]}"></span>${esc(TNAME[t.k])}</span></td>
    <td>${esc(routeStr(t.route))||'<span class="note">'+esc(t.pts.map(p=>p.p).filter(Boolean).join(" → "))+"</span>"}
    ${S.track===t.id?`<div class="posts" style="max-height:none">${t.pts.map(p=>`<div class="line"><span class="tm">${fmtT(new Date(p.t))}</span><span>${esc(p.x)}</span></div>`).join("")}</div>`:""}</td>
    <td class="r num">${t.n}</td><td class="r num">${t.min}</td></tr>`).join("")}</tbody></table>${list.length>150?`<p class="note">Показано 150 из ${list.length}</p>`:""}`;
  el.querySelectorAll("tr.click").forEach(r=>r.onclick=()=>{S.track=S.track===r.dataset.id?null:r.dataset.id;render();
    document.getElementById("map")?.scrollIntoView({block:"nearest",behavior:"smooth"})});
}

function missStr(r){const M=/(Калібр|Іскандер-[МК](?:\/С-400)?|С-300|С-400|Х-101|Х-59\/69|Х-59|Х-69|Х-22|Х-31П?|Кинджал|Циркон|Онікс|KN-23)/;
  return (r.missiles||[]).map(m=>{const md=(m.detail||"").match(M);return `${m.n!=null?m.n+"× ":""}${md?md[1]:m.kind}`}).join(", ")}
function repLabel(r){const d=fmtD(new Date(r.t));return r.kind==="night"?`Ночь на ${d}`:`День ${d}`}
function repRows(rs){
  const mx=Math.max(1,...rs.map(r=>r.attackedTotal||0));
  return `<div class="rlg"><span><i style="background:var(--s1)"></i>сбито / подавлено</span><span><i style="background:var(--s2)"></i>не сбито</span><span class="note">длина полосы — сколько атаковано</span></div>
  <div class="rrows">${rs.slice().reverse().map(r=>{const A=r.attackedTotal||0,D=Math.min(A,r.downedTotal||0),p=pct(D,A);const ms=missStr(r);const open=S.rep===r.id;
    const tags=[r.uavJet?`реактивных ${r.uavJet}`:"",r.banderolN?`«Бандероль» ${r.banderolN}`:"",ms?`ракеты: ${esc(ms)}`:"",r.hits!=null?`попадания ${r.hits} лок.`:"",r.debris!=null?`обломки ${r.debris} лок.`:""].filter(Boolean);
    return `<div class="rrow ${open?"on":""}" data-id="${r.id}" tabindex="0" title="${esc(repLabel(r))}: атаковано ${A}, сбито ${D}${p!=null?" ("+p+"%)":""}">
      <div class="rl"><b>${repLabel(r)}</b><span class="note">на ${esc(r.asOf||fmtT(new Date(r.t)))}</span></div>
      <div class="rbar"><span class="rtrack" style="width:${(A/mx*100).toFixed(1)}%"><i class="rd" style="flex:${D}"></i>${A-D>0?`<i class="ru" style="flex:${A-D}"></i>`:""}</span></div>
      <div class="rv num"><b>${nf(D)}</b><span>/ ${nf(A)}</span><em>${p==null?"—":p+"%"}</em></div>
      <div class="rtags">${tags.map(t=>`<span class="bdg">${t}</span>`).join("")}<a class="bdg lnk" href="https://t.me/kpszsu/${r.id}" target="_blank" rel="noopener">пост ↗</a></div>
      ${open?`<div class="rdet">${r.launchFrom?.length?`<div class="note"><b>Откуда пуски:</b> ${esc(r.launchFrom.join(", "))}</div>`:""}<p>${esc(r.text)}</p></div>`:""}</div>`}).join("")}</div>`}
function bindRep(el){el.querySelectorAll(".rrow").forEach(r=>{const go=e=>{if(e.target.closest("a"))return;S.rep=S.rep===+r.dataset.id?null:+r.dataset.id;renderReports(windowOf(S.h),S.h>24)};
  r.onclick=go;r.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();go(e)}}})}
function renderReports(win,long){
  const el=$("#reports");
  const rs=reportsIn(win);
  if(!rs.length){el.innerHTML=`<div class="empty">В этом периоде сводок ещё не было. Ночная сводка выходит утром (~07:30–08:00), дневная — вечером.</div>`;return}
  const tot="";
  if(!long){el.innerHTML=repRows(rs);bindRep(el);return}
  // по днях: стовпчики атаковано vs збито
  const days={};for(const r of rs){const d=kyivDay(new Date(r.t));const o=days[d]=days[d]||{att:0,down:0,hits:0};o.att+=r.attackedTotal||0;o.down+=r.downedTotal||0;o.hits+=r.hits||0}
  const keys=Object.keys(days).sort();const max=niceMax(Math.max(10,...keys.map(k=>days[k].att)));
  const W=Math.max(320,Math.round(el.clientWidth||520)),H=190,L=36,R=6,T=10,B=26,pw=W-L-R,ph=H-T-B,bw=pw/keys.length;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Атаковано и сбито по дням">`;
  for(let g=0;g<=4;g++){const y=T+ph-ph*g/4;s+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="var(--grid)"/><text x="${L-6}" y="${y+4}" text-anchor="end">${Math.round(max*g/4)}</text>`}
  keys.forEach((k,i)=>{const d=days[k];const x=L+i*bw;const w=Math.max(2,bw*.38);
    const h1=ph*d.att/max,h2=ph*d.down/max;
    s+=`<rect x="${x+bw*.1}" y="${T+ph-h1}" width="${w}" height="${h1}" fill="var(--s2)" rx="2"/><rect x="${x+bw*.1+w+1}" y="${T+ph-h2}" width="${w}" height="${h2}" fill="var(--s1)" rx="2"/>`;
    s+=`<rect class="hit" data-i="${i}" x="${x}" y="${T}" width="${bw}" height="${ph}" fill="transparent"/>`;
    if(i%Math.max(1,Math.ceil(keys.length/Math.max(1,Math.floor(pw/64))))===0)s+=`<text x="${x+bw/2}" y="${H-8}" text-anchor="middle">${fmtD(new Date(k+"T12:00:00Z"))}</text>`});
  s+="</svg>";
  const tA=keys.reduce((a,k)=>a+days[k].att,0),tD=keys.reduce((a,k)=>a+days[k].down,0);
  el.innerHTML=tot+`<div class="chart">${s}<div class="tip" hidden></div></div><div class="lg"><span><i class="sw" style="background:var(--s2)"></i>Атаковано</span><span><i class="sw" style="background:var(--s1)"></i>Сбито/подавлено</span></div>
   <details ${S.rep||S.repAll?"open":""}><summary class="note">Все сводки по отдельности (${rs.length})</summary>${repRows(rs)}</details>`;bindRep(el);
  el.querySelector("details").ontoggle=e=>{S.repAll=e.target.open};
  hover(el.querySelector(".chart"),".hit",i=>{const d=days[keys[i]];return `<b>${fmtD(new Date(keys[i]+"T12:00:00Z"))}</b><br>Атаковано: ${d.att}<br>Сбито: ${d.down} (${pct(d.down,d.att)??"—"}%)<br>Попадания: ${d.hits} лок.`});
}

function renderHeat(ev,win){
  const el=$("#heat");const nd=Math.round(S.h/24);
  const days=[];for(let i=nd-1;i>=0;i--)days.push(kyivDay(new Date(win[1]-i*24*3600e3)));
  const di=new Map(days.map((d,i)=>[d,i]));const M=days.map(()=>Array(24).fill(0));
  {const seen=new Set();for(const e of ev){if(S.type&&e.k!==S.type)continue;const d=new Date(e.t);const i=di.get(kyivDay(d));if(i==null)continue;const h=kyivHour(d),sk=i+"|"+h+"|"+tid(e);if(seen.has(sk))continue;seen.add(sk);M[i][h]++}}
  const max=Math.max(1,...M.flat());
  const L=56,T=6,cw=34,chh=Math.max(10,Math.min(22,300/nd)),W=L+24*cw+4,H=T+nd*chh+22;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Тепловая карта час × день">`;
  M.forEach((row,i)=>{row.forEach((v,h)=>{const q=v?Math.min(7,1+Math.floor(v/max*6.999)):0;
    s+=`<rect class="hit" data-i="${i*24+h}" x="${L+h*cw+1}" y="${T+i*chh+1}" width="${cw-2}" height="${chh-2}" rx="2" fill="var(--q${q})"/>`});
    if(nd<=10||i%3===0)s+=`<text x="${L-6}" y="${T+i*chh+chh/2+4}" text-anchor="end">${fmtD(new Date(days[i]+"T12:00:00Z"))}</text>`});
  for(let h=0;h<24;h+=3)s+=`<text x="${L+h*cw+cw/2}" y="${H-6}" text-anchor="middle">${String(h).padStart(2,"0")}:00</text>`;
  s+="</svg>";el.innerHTML=s+`<div class="tip" hidden></div>`;
  hover(el,".hit",k=>{const i=Math.floor(k/24),h=k%24;return `<b>${fmtD(new Date(days[i]+"T12:00:00Z"))}, ${String(h).padStart(2,"0")}:00–${String(h+1).padStart(2,"0")}:00</b><br>${M[i][h]} ${plT(M[i][h])}`});
}

function renderLaunch(win){
  const rs=reportsIn(win);const c={};for(const r of rs)for(const d of new Set(r.launchFrom||[]))c[d]=(c[d]||0)+1;
  const list=Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,12);const el=$("#launch");
  if(!list.length){el.innerHTML=`<div class="empty">В сводках периода районы не указаны.</div>`;return}
  const max=list[0][1];
  el.innerHTML=`<table><tbody>${list.map(([n,v])=>`<tr><td style="width:40%">${esc(n)}</td><td><div style="height:10px;border-radius:0 4px 4px 0;background:var(--s1);width:${Math.max(4,v/max*100)}%"></div></td><td class="r num">${v}</td></tr>`).join("")}</tbody></table><p class="note">Из ${rs.length} сводок.</p>`;
}

function renderPosts(evF,win){
  const list=evF.slice().sort((a,b)=>a.t<b.t?1:-1);
  $("#posts").innerHTML=list.slice(0,400).map(lineHTML).join("")+(list.length>400?`<p class="note">Показано 400 из ${list.length}</p>`:"");
  let un=0;for(const d of Object.values(S.days))for(const u of d.unparsed||[])if(inWin(u.t,win))un++;
  $("#unpc").innerHTML=un?` <span class="unp">· нераспознанных строк: ${un}</span>`:"";
}

// ---------- загрузка данных (data.json собирает GitHub Actions)
const REPO="https://github.com/UkDC/kpszsu-dashboard";
let loading=false;
async function load(manual){
  if(loading)return;loading=true;const btn=$("#reload");if(btn){btn.disabled=true;btn.textContent="Загрузка…"}
  try{
    const r=await fetch("data.json?t="+Date.now(),{cache:"no-store"});
    if(!r.ok)throw new Error("HTTP "+r.status);
    const j=await r.json();
    S.days=j.days||{};S.reports=j.reports||{};S.meta=j.meta?.state||null;S.ballistic=j.meta?.ballistic?.intervals||[];
    if(!Object.keys(S.days).length){$("#app").innerHTML=`<div class="panel"><b>Данных пока нет.</b><span class="note">Первый сбор ещё не прошёл.</span></div>`;return}
    S.ready=true;render();
  }catch(e){
    if(!S.ready)$("#app").innerHTML=`<div class="panel"><b>Данные недоступны.</b><span class="note">${esc(e.message||String(e))}. Обновите страницу позже.</span></div>`;
    else if(manual)alert("Не удалось загрузить данные: "+(e.message||e));
  }finally{loading=false;if(btn){btn.disabled=false;btn.textContent="Обновить"}}
}
$("#reload")?.addEventListener("click",()=>load(true));
document.addEventListener("visibilitychange",()=>{if(!document.hidden)load()}); // вернулись на вкладку — подтянуть свежее
setInterval(()=>load(),5*60e3);
setInterval(()=>S.ready&&render(),60000); // окна периодов и «N мин назад» сдвигаются со временем
load();
render();
</script>
